version: '3.8'

services:
  # Your .NET API with production-like database
  api:
    build: .
    container_name: restapi-app
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      # Use PostgreSQL for production-like development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=restapi_dev;Username=postgres;Password=dev_password_123
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - api-network
    restart: unless-stopped

  # PostgreSQL database (production-like)
  postgres:
    image: postgres:15-alpine
    container_name: restapi-postgres
    environment:
      - POSTGRES_DB=restapi_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=dev_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Optional: Add init script for seeding
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - api-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: restapi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - api-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Nginx reverse proxy (production-like)
  nginx:
    image: nginx:alpine
    container_name: restapi-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - api-network
    restart: unless-stopped

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: restapi-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=dev@restapi.local
      - PGADMIN_DEFAULT_PASSWORD=admin123
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - api-network
    restart: unless-stopped

# Persistent volumes
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# Custom network
networks:
  api-network:
    driver: bridge