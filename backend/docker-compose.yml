version: '3.8'

services:
  # Your .NET API
  api:
    build: .
    container_name: restapi-app
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__SqliteConnection=Data Source=/app/data/RestApiProject.db
    volumes:
      - api_data:/app/data
    depends_on:
      - redis
    networks:
      - api-network
    restart: unless-stopped

  # Redis for caching (if you add caching later)
  redis:
    image: redis:7-alpine
    container_name: restapi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - api-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Nginx reverse proxy (optional - for production-like setup)
  nginx:
    image: nginx:alpine
    container_name: restapi-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - api-network
    restart: unless-stopped

# Persistent volumes
volumes:
  api_data:
    driver: local
  redis_data:
    driver: local

# Custom network
networks:
  api-network:
    driver: bridge