services:
  postgres:
    restart: unless-stopped

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set in .env}
    restart: unless-stopped
    depends_on:
      - api
